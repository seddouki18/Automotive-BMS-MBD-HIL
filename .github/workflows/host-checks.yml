name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: CAN callback regression
        run: python3 tests/test_can_callback.py
      - name: Documentation links
        run: python3 tests/check_docs.py
